<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="temp.css">
    
</head>

<body>

    <div class="container">

        <div class="converter-card">

            <div class="header">
                <div class="icon">🌡️</div>

                <h1>Temperature Converter</h1>

                <p>
                    Convert temperatures between Celsius,
                    Fahrenheit and Kelvin.
                </p>
            </div>


            <form id="converterForm">

                <!-- Temperature Input -->
                <div class="form-group">

                    <label for="temperature">
                        Temperature
                    </label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter temperature"
                        step="any"
                    >

                </div>


                <!-- Unit Selector -->
                <div class="form-group">

                    <label for="unit">
                        Convert From
                    </label>

                    <select id="unit">

                        <option value="celsius">
                            Celsius (°C)
                        </option>

                        <option value="fahrenheit">
                            Fahrenheit (°F)
                        </option>

                        <option value="kelvin">
                            Kelvin (K)
                        </option>

                    </select>

                </div>


                <!-- Convert Button -->
                <button type="submit" class="convert-btn">
                    Convert Temperature
                </button>

            </form>


            <!-- Error Message -->
            <div id="errorMessage" class="error-message"></div>


            <!-- Results -->
            <div class="results">

                <h2>Conversion Results</h2>

                <div class="result-grid">

                    <div class="result-card">

                        <span>Celsius</span>

                        <strong id="celsiusResult">
                            --
                        </strong>

                    </div>


                    <div class="result-card">

                        <span>Fahrenheit</span>

                        <strong id="fahrenheitResult">
                            --
                        </strong>

                    </div>


                    <div class="result-card">

                        <span>Kelvin</span>

                        <strong id="kelvinResult">
                            --
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="temp.js"></script>

</body>
</html>
